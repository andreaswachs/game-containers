name: cobblemon Image CI

on:
  workflow_dispatch:
  push:
    paths:
      - cobblemon/**
      - ./github/workflows/cobblemon-image.yaml

permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Push cobblemon image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load versions from versions.env
        id: versions
        run: |
          # Source the versions file and export to GITHUB_OUTPUT
          while IFS='=' read -r key value; do
            # Skip comments and empty lines
            [[ "$key" =~ ^#.*$ ]] && continue
            [[ -z "$key" ]] && continue
            # Remove leading/trailing whitespace
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done < cobblemon/versions.env

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./cobblemon
          file: ./cobblemon/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            COBBLEMON_VERSION=${{ steps.versions.outputs.COBBLEMON_VERSION }}
            MINECRAFT_VERSION=${{ steps.versions.outputs.MINECRAFT_VERSION }}
            FABRIC_LOADER_VERSION=${{ steps.versions.outputs.FABRIC_LOADER_VERSION }}
            FABRIC_INSTALLER_VERSION=${{ steps.versions.outputs.FABRIC_INSTALLER_VERSION }}
            FABRIC_API_VERSION=${{ steps.versions.outputs.FABRIC_API_VERSION }}
            FABRIC_API_MODRINTH_ID=${{ steps.versions.outputs.FABRIC_API_MODRINTH_ID }}
            COBBLEMON_MODRINTH_ID=${{ steps.versions.outputs.COBBLEMON_MODRINTH_ID }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/cobblemon:latest
            ghcr.io/${{ github.repository_owner }}/cobblemon:${{ steps.versions.outputs.COBBLEMON_VERSION }}
