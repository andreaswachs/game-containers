name: unshare Image CI

on:
  workflow_dispatch:
  push:
    paths:
      - unshare/**
      - .github/workflows/unshare-image.yml

permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Push unshare image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load versions from versions.env
        id: versions
        run: |
          build_args=""
          while IFS='=' read -r key value; do
            [[ "$key" =~ ^#.*$ ]] && continue
            [[ -z "$key" ]] && continue
            key=$(echo "$key" | xargs)
            value=$(echo "$value" | xargs)
            echo "${key}=${value}" >> $GITHUB_OUTPUT
            build_args="${build_args}${key}=${value}\n"
          done < unshare/versions.env
          echo "build_args<<EOF" >> $GITHUB_OUTPUT
          echo -e "$build_args" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Load tag from image.yaml
        id: tag
        run: echo "tag=$(grep '^tag:' unshare/image.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./unshare
          file: ./unshare/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ steps.versions.outputs.build_args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/minecraft-unshare:latest
            ghcr.io/${{ github.repository_owner }}/minecraft-unshare:${{ steps.tag.outputs.tag }}
